[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlens"
version = "0.2.0"
description = "Local-first observability for AI coding agents. Maximum visibility. Minimum token overhead."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.86", "rich>=13"]
dev = ["pytest>=8", "textual>=0.86", "rich>=13"]

[project.scripts]
agentlens = "agentlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
