name: Bug report
description: Something AgentLens records, shows or installs is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets, file contents or private prompts.** For a privacy or security problem
        (something sensitive reaching disk, a redaction miss), use Security → Report a vulnerability instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. agentlens install
        2. start a Claude Code session and ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `agentlens doctor`
      description: Review it first and replace any paths you'd rather not share.
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "agentlens 0.1.1, Claude Code 2.1.323, macOS 15 / Ubuntu 24.04, Python 3.13"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is AgentLens installed?
      options: [Claude Code plugin, settings hooks (agentlens install), both]
    validations:
      required: true
